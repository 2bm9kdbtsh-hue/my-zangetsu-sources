name: Provider validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check provider JavaScript syntax
        run: |
          node --check providers/topcinemaa.js
          node --check providers/animexin.js
          node --check providers/nxxhentai.js
      - name: Validate source index JSON
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('index.json', 'utf8'));
          if (!Array.isArray(manifest.sources)) throw new Error('index.sources must be an array');
          const source = manifest.sources.find((item) => item.id === 'topcinemaa');
          if (!source || !/^\\d+\\.\\d+\\.\\d+$/.test(source.version) || source.file !== 'providers/topcinemaa.js') {
            throw new Error('Top Cinema manifest entry is invalid');
          }
          const provider = fs.readFileSync(source.file, 'utf8');
          const match = provider.match(/var VERSION = ["']([^"']+)["']/);
          if (!match || match[1] !== source.version) {
            throw new Error('Top Cinema provider VERSION does not match index.json');
          }
          NODE
