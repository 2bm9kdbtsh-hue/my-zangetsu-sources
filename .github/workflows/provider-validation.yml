name: Provider validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check provider JavaScript syntax
        run: |
          node --check providers/topcinemaa.js
          node --check providers/animexin.js
          node --check providers/nxxhentai.js
      - name: Validate source index JSON
        run: |
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('index.json','utf8')); if(!Array.isArray(x.sources)) process.exit(1); const p=x.sources.find(s=>s.id==='topcinemaa'); if(!p || p.version!=='1.4.0' || p.file!=='providers/topcinemaa.js') process.exit(1);"
